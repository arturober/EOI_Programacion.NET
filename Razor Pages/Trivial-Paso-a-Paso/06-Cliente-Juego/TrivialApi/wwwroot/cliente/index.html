<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente HTML y JS para jugar al Trivial</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.css"
          rel="stylesheet">          
</head>
<body>
    <main class="container my-5">

        <h1 class="text-center mb-4">
            Juego de Trivial
            <a href="/" class="btn btn-success btn-sm ms-3">Ir a la API</a>
        </h1>

        <section id="inicio">
            <h2>Elige una categoría y responde a las preguntas</h2>

            <label for="categoria" class="form-label">Categoría:</label>
            <select id="categoria" class="form-select mb-3">
                <option value="">Selecciona una categoría para filtrar las preguntas</option>
            </select>

            <button id="empezar" class="btn btn-primary mb-3">Empezar Juego</button>
        </section>

        <section id="juego" class="d-none">
            <h2 id="progreso">Pregunta</h2>

            <h3 id="enunciado" class="mb-3"></h3>

            <div id="respuestas" class="mb-3"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
    <script src="trivial.js"></script>
    
</body>
</html>
