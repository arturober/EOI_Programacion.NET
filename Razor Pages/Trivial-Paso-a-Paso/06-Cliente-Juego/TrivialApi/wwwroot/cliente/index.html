<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">

    <!-- Viewport permite que Bootstrap ajuste el diseño en teléfonos. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
          content="Cliente estático para la API de preguntas de trivial.">
    <title>Cliente Trivial</title>

    <!-- Bootstrap proporciona la apariencia completa sin un CSS propio. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- SweetAlert mostrará los resultados de cada respuesta y de la partida. -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.css"
          rel="stylesheet">
</head>
<body class="bg-body-tertiary min-vh-100 d-flex flex-column">
    <nav class="navbar bg-primary shadow-sm" data-bs-theme="dark">
        <div class="container">
            <!-- La marca recarga el propio cliente y comienza desde el inicio. -->
            <a class="navbar-brand fw-bold"
               href="/cliente/index.html">
                Cliente Trivial
            </a>

            <!-- La administración Razor se encuentra en la raíz del servidor. -->
            <a class="btn btn-light" href="/">
                Volver a la API
            </a>
        </div>
    </nav>

    <main class="container py-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Esta tarjeta se muestra antes de comenzar una partida. -->
                <section id="inicio" class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="display-6 fw-bold">
                            Partida rápida
                        </h1>
                        <p class="lead">
                            Elige una categoría y responde diez preguntas.
                        </p>

                        <label for="categoria" class="form-label">
                            Categoría
                        </label>

                        <!-- JavaScript añadirá aquí las categorías recibidas. -->
                        <select id="categoria"
                                class="form-select mb-3">
                            <option value="">Todas las categorías</option>
                        </select>

                        <button id="jugar"
                                class="btn btn-primary btn-lg"
                                type="button">
                            Empezar
                        </button>
                    </div>
                </section>

                <!-- d-none mantiene esta tarjeta oculta hasta empezar. -->
                <section id="juego"
                         class="card shadow-sm d-none">
                    <div class="card-body p-4 p-md-5">
                        <div class="d-flex justify-content-between mb-3">
                            <span id="progreso"
                                  class="badge text-bg-primary"></span>
                            <span id="puntos"
                                  class="badge text-bg-success"></span>
                        </div>

                        <span id="nombreCategoria"
                              class="badge text-bg-secondary mb-3"></span>

                        <h2 id="enunciado" class="h3 mb-4"></h2>

                        <!-- Los botones de respuesta se crearán dinámicamente. -->
                        <div id="respuestas"
                             class="d-grid gap-2"></div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="border-top bg-body py-4">
        <div class="container text-center text-body-secondary small">
            Cliente desarrollado con HTML, JavaScript, Bootstrap y Fetch API.
        </div>
    </footer>

    <!-- SweetAlert debe cargarse antes de nuestro archivo trivial.js. -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
    <script src="trivial.js"></script>
</body>
</html>
